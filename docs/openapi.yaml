openapi: 3.1.0
info:
  title: Kairos API
  version: 1.0.0
paths:
  /users/me:
    get:
      summary: Get the authenticated user's public profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { description: Missing or invalid JWT }
    patch:
      summary: Update the authenticated user's name and username
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { description: Validation error }
        '401': { description: Missing or invalid JWT }
        '400': { description: Validation error or username already in use }
  /users/me/password:
    post:
      summary: Change the authenticated user's password
      description: Existing JWTs remain valid until expiry; this endpoint does not revoke tokens.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '400': { description: Validation error or confirmation mismatch }
        '401': { description: Missing or invalid JWT, or invalid current password }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfile:
      type: object
      required: [id, name, username, email, emailConfirmed, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        emailConfirmed: { type: boolean }
        roles:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 255 }
        username: { type: string, maxLength: 100 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
        newPasswordConfirmation: { type: string, format: password }
