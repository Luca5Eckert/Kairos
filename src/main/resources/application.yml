spring:

  application:
    name: kairos

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${KAIROS_LLM_MODEL:gemini-2.5-flash}
            temperature: ${KAIROS_LLM_TEMPERATURE:0.0}
            max-output-tokens: ${KAIROS_LLM_MAX_OUTPUT_TOKENS:4096}

  data:
    neo4j:
      repositories:
        type: none

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kairos}
    username: ${POSTGRES_USER:kairos}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_BOLT_PORT:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

logging:
  level:
    com.kairos: INFO

kairos:
  mail:
    from: ${MAIL_FROM:no-reply@kairos.local}
  retrieval:
    semantic-anchor-limit: ${KAIROS_SEMANTIC_ANCHOR_LIMIT:10}
    graph-passage-limit: ${KAIROS_GRAPH_PASSAGE_LIMIT:20}
    seed-min-score: ${KAIROS_SEED_MIN_SCORE:0.45}
    seed-relative-threshold: ${KAIROS_SEED_RELATIVE_THRESHOLD:0.85}
  graph:
    orphan-cleanup-interval-ms: ${KAIROS_GRAPH_ORPHAN_CLEANUP_INTERVAL_MS:600000}

auth:
  session:
    secret: ${AUTH_SESSION_SECRET:dev-only-change-me-dev-only-change-me}
    issuer: ${AUTH_SESSION_ISSUER:https://auth.kairos.local}
    audience: ${AUTH_SESSION_AUDIENCE:kairos-api}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:2h}

gemini:
  apiKey: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gpt-4.0}
  temperature: 0.7
  maxOutputTokens: 2048
  timeoutSeconds: 30
  retry:
    maxRetries: 3
    delay: 2000
    multiplier: 2.0
    maxDelay: 60000
