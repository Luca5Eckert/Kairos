name: Backend metrics reference

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: backend-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare pinned model
        run: bash infra/scripts/prepare-model.sh

      - name: M12/M13 - JVM inference and contract fixtures
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress \
            -Dtest=EmbeddingPerformanceBenchmarkIT,StructuredExtractionContractBenchmarkIT \
            -Dmetrics.commitSha="${SOURCE_SHA}" test

      - name: M11 - Complete graph/vector retrieval evaluation
        run: GITHUB_SHA="${SOURCE_SHA}" bash scripts/ai/evaluate-retrieval.sh

      - name: Terraform CLI
        uses: hashicorp/setup-terraform@v3

      - name: M16 - Static Terraform validation (no AWS apply)
        run: bash scripts/metrics/validate-terraform.sh

      - name: Summarize verified and missing artifacts
        if: always()
        run: python3 scripts/metrics/collect_evidence.py --sha "${SOURCE_SHA}"

      - name: Upload raw and summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-backend-metrics-${{ env.SOURCE_SHA }}
          path: |
            target/metrics/
            target/evaluation/retrieval/
            target/surefire-reports/TEST-com.kairos.module.context_engine.evaluation.*.xml
          if-no-files-found: warn
          retention-days: 30
