name: Validation

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ci-placeholder
      POSTGRES_PASSWORD: ci-placeholder
      NEO4J_PASSWORD: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Compile, test, package, and enforce coverage
        run: bash scripts/ai/validate.sh

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
