name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ci-placeholder
      POSTGRES_PASSWORD: ci-placeholder
      NEO4J_PASSWORD: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Download and verify the ONNX model
        run: bash infra/scripts/prepare-model.sh

      - name: Compile, test, package, and enforce coverage
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container build, smoke test, and scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_DB: kairos
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ci-postgres-password
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-neo4j-password
      GEMINI_API_KEY: ci-placeholder
      MAIL_HOST: localhost
      MAIL_USERNAME: ci
      MAIL_PASSWORD: ci-placeholder
      MAIL_FROM: no-reply@kairos.local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: kairos-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start PostgreSQL and Neo4j
        run: docker compose up --detach --wait --wait-timeout 240 postgres neo4j

      - name: Start Kairos
        run: |
          docker run --detach \
            --name kairos-ci-app \
            --network kairos-net \
            --publish 127.0.0.1:8080:8080 \
            --env SPRING_PROFILES_ACTIVE=docker \
            --env POSTGRES_HOST=postgres \
            --env POSTGRES_DB="${POSTGRES_DB}" \
            --env POSTGRES_USER="${POSTGRES_USER}" \
            --env POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --env NEO4J_HOST=neo4j \
            --env NEO4J_USER="${NEO4J_USER}" \
            --env NEO4J_PASSWORD="${NEO4J_PASSWORD}" \
            --env GEMINI_API_KEY="${GEMINI_API_KEY}" \
            --env MAIL_HOST="${MAIL_HOST}" \
            --env MAIL_USERNAME="${MAIL_USERNAME}" \
            --env MAIL_PASSWORD="${MAIL_PASSWORD}" \
            --env MAIL_FROM="${MAIL_FROM}" \
            --env KAIROS_ADMIN_BOOTSTRAP_ENABLED=false \
            kairos-ci:${GITHUB_SHA}

      - name: Wait for the application healthcheck
        run: |
          for attempt in {1..36}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' kairos-ci-app 2>/dev/null || true)"
            if [[ "${status}" == "healthy" ]]; then
              curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
              exit 0
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              break
            fi
            sleep 5
          done

          docker logs kairos-ci-app
          exit 1

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kairos-ci:${{ github.sha }}
          format: cyclonedx
          output: kairos-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: kairos-sbom
          path: kairos-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Block critical container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kairos-ci:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs kairos-ci-app 2>/dev/null || true
          docker compose logs --no-color postgres neo4j

      - name: Clean up containers
        if: always()
        run: |
          docker rm --force kairos-ci-app 2>/dev/null || true
          docker compose down --volumes --remove-orphans
