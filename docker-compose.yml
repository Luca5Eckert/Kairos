name: kairos

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kairos-net

  neo4j:
    build:
      context: .
      dockerfile: Dockerfile.neo4j
    image: kairos-neo4j:5.26-gds
    container_name: kairos-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - kairos-net

  kairos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kairos-app
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KAIROS_LLM_MODEL: ${KAIROS_LLM_MODEL}
      KAIROS_LLM_TEMPERATURE: ${KAIROS_LLM_TEMPERATURE}
      KAIROS_LLM_MAX_OUTPUT_TOKENS: ${KAIROS_LLM_MAX_OUTPUT_TOKENS}
      MAIL_HOST: ${MAIL_HOST:?required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      MAIL_FROM: ${MAIL_FROM:?required}
      KAIROS_ADMIN_BOOTSTRAP_ENABLED: "${KAIROS_ADMIN_BOOTSTRAP_ENABLED:-true}"
      KAIROS_ADMIN_NAME: "${KAIROS_ADMIN_NAME:-Kairos Admin}"
      KAIROS_ADMIN_USERNAME: "${KAIROS_ADMIN_USERNAME:-admin}"
      KAIROS_ADMIN_EMAIL: "${KAIROS_ADMIN_EMAIL:-admin@kairos.local}"
      KAIROS_ADMIN_PASSWORD: "${KAIROS_ADMIN_PASSWORD:-Admin123!}"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:exec
    networks:
      - kairos-net

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:

networks:
  kairos-net:
    name: kairos-net
    driver: bridge
